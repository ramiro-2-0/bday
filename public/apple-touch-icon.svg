<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ECBF5" />
      <stop offset="60%" stop-color="#BDE8FF" />
      <stop offset="100%" stop-color="#E2FA75" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#382417" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#skyGrad)" />

  <!-- Heart Cloud -->
  <path d="M256 120 C180 50 120 100 150 160 C120 160 100 200 140 220 C256 310 256 310 256 310 C256 310 256 310 372 220 C412 200 392 160 362 160 C392 100 332 50 256 120 Z" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)" />

  <!-- Cake Base -->
  <g transform="translate(146, 220)" filter="url(#shadow)">
    <!-- Plate -->
    <ellipse cx="110" cy="180" rx="95" ry="16" fill="#FFFFFF" stroke="#382417" stroke-width="6" />
    
    <!-- Bottom Tier -->
    <rect x="35" y="90" width="150" height="75" rx="16" fill="#FF6584" stroke="#382417" stroke-width="6" />
    <ellipse cx="110" cy="90" rx="75" ry="16" fill="#FFFFFF" stroke="#382417" stroke-width="6" />

    <!-- Top Tier -->
    <rect x="60" y="35" width="100" height="55" rx="14" fill="#FFAEC0" stroke="#382417" stroke-width="6" />
    <ellipse cx="110" cy="35" rx="50" ry="12" fill="#FFFFFF" stroke="#382417" stroke-width="6" />

    <!-- Candle -->
    <rect x="102" y="-20" width="16" height="55" rx="6" fill="#FFD23F" stroke="#382417" stroke-width="5" />
    <!-- Wick -->
    <line x1="110" y1="-20" x2="110" y2="-32" stroke="#382417" stroke-width="4" stroke-linecap="round" />
    <!-- Flame -->
    <ellipse cx="110" cy="-48" rx="12" ry="20" fill="#FF9248" />
    <ellipse cx="110" cy="-46" rx="7" ry="14" fill="#FFD23F" />
    <ellipse cx="110" cy="-42" rx="3" ry="7" fill="#FFFFFF" />

    <!-- Hearts & Stars on Cake -->
    <text x="75" y="140" font-size="24" fill="#FFFFFF">💖</text>
    <text x="125" y="140" font-size="24" fill="#FFFFFF">✨</text>
  </g>

  <!-- Bubu & Dudu Paws peaking at bottom -->
  <circle cx="100" cy="460" r="32" fill="#C49A76" stroke="#382417" stroke-width="6" />
  <circle cx="412" cy="460" r="32" fill="#FFFFFF" stroke="#382417" stroke-width="6" />
</svg>
